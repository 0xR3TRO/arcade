<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Flap — tap to fly through the gaps. Part of R3TRO Arcade." />
        <title>Flap · R3TRO Arcade</title>
        <link rel="stylesheet" href="../../shared/game.css" />
        <style>
            :root {
                --w: 420px;
                --ratio: 1.7778; /* 640 / 360 */
            }
        </style>
    </head>
    <body>
        <header class="game-header">
            <h1 class="game-title">FLAP</h1>
            <div class="stats">
                <div class="stat"><span>Score</span><b id="score">0</b></div>
                <div class="stat"><span>Best</span><b id="best">0</b></div>
            </div>
        </header>

        <main class="stage">
            <div class="frame">
                <canvas class="board fit-height" id="board" aria-label="Flap game board"></canvas>
                <div class="overlay" id="overlay">
                    <div>
                        <h2 id="overlay-title">FLAP</h2>
                        <p id="overlay-text">Tap, click or press <kbd>Space</kbd> to flap.<br />Fly through the gaps.</p>
                        <button class="btn" id="start">Play</button>
                    </div>
                </div>
            </div>
        </main>

        <p class="hint"><kbd>Space</kbd> / <kbd>↑</kbd> / tap — flap · <kbd>P</kbd> — pause</p>

        <script src="../../shared/scores.js"></script>
        <script src="../../shared/canvas.js"></script>
        <script src="game.js"></script>
        <script src="../../shared/back.js" defer></script>
    </body>
</html>
